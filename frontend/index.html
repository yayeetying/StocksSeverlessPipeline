<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Top Movers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    header p {
      color: #7d8590;
      margin-top: 0.4rem;
      font-size: 0.875rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.4rem 1.6rem;
      border-left: 4px solid #30363d;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .card:hover { transform: translateY(-2px); }
    .card.gain  { border-left-color: #2ea043; }
    .card.loss  { border-left-color: #da3633; }

    .card-date {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7d8590;
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.18rem 0.55rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    .badge-gain { background: rgba(46,160,67,0.18);  color: #3fb950; }
    .badge-loss { background: rgba(218,54,51,0.18);  color: #f85149; }

    .card-ticker {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .card.gain .card-ticker { color: #3fb950; }
    .card.loss .card-ticker { color: #f85149; }

    .card-pct   { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.2rem; }
    .card-close { font-size: 0.82rem; color: #7d8590; }

    #status, #error {
      text-align: center;
      padding: 4rem 0;
      font-size: 0.95rem;
    }
    #status { color: #7d8590; }
    #error  { color: #f85149; }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: #30363d;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Daily Top Mover</h1>
    <p>Watchlist: AAPL &middot; MSFT &middot; GOOGL &middot; AMZN &middot; TSLA &middot; NVDA</p>
  </header>

  <div id="status">Loading…</div>
  <div id="error"  style="display:none"></div>
  <div id="grid"   class="grid" style="display:none"></div>

  <footer>Powered by Massive &amp; AWS &middot; Updated nightly after market close</footer>

  <script>
    // config.json is deployed alongside this file by CDK and contains
    // {"apiUrl": "https://...execute-api.../prod/movers"}
    async function init() {
      const status = document.getElementById("status");
      const error  = document.getElementById("error");
      const grid   = document.getElementById("grid");

      try {
        // Step 1: resolve the API URL from CDK-injected config
        const cfgRes = await fetch("config.json");
        if (!cfgRes.ok) throw new Error("Could not load config.json");
        const { apiUrl } = await cfgRes.json();

        // Step 2: fetch movers from the API
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`API responded with HTTP ${res.status}`);
        const { movers } = await res.json();

        status.style.display = "none";

        if (!movers || movers.length === 0) {
          status.style.display = "block";
          status.textContent   = "No data yet — check back after today's market close.";
          return;
        }

        grid.style.display = "grid";
        grid.innerHTML = movers.map(m => {
          const isGain = m.pct_change >= 0;
          const cls    = isGain ? "gain" : "loss";
          const badge  = isGain ? "GAIN" : "LOSS";
          const sign   = isGain ? "+" : "";
          const close  = Number(m.close_price).toFixed(2);
          const date   = formatDate(m.date);

          return `
            <div class="card ${cls}">
              <div class="card-date">${date}</div>
              <span class="badge badge-${cls}">${badge}</span>
              <div class="card-ticker">${escHtml(m.ticker)}</div>
              <div class="card-pct">${sign}${m.pct_change.toFixed(2)}%</div>
              <div class="card-close">Close: $${close}</div>
            </div>`;
        }).join("");

      } catch (err) {
        status.style.display = "none";
        error.style.display  = "block";
        error.textContent    = `Failed to load data: ${err.message}`;
      }
    }

    function formatDate(iso) {
      return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", {
        weekday: "short", month: "short", day: "numeric", timeZone: "UTC",
      });
    }

    // Basic XSS guard for any string rendered into innerHTML
    function escHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    init();
  </script>
</body>
</html>
